  <script>
    const ADMIN_SECRET_KEY = "ecm1017";

    function evaluateCoupon(expireDateStr) {
      if (!expireDateStr || expireDateStr === '상시' || expireDateStr.includes('9999')) {
        return { status: 'active', ddayText: '상시 유효', isPurge: false };
      }
      const target = new Date(expireDateStr);
      if (isNaN(target.getTime())) return { status: 'active', ddayText: '상시 유효', isPurge: false };
      const today = new Date(); today.setHours(0,0,0,0); target.setHours(0,0,0,0);
      const diffDays = Math.ceil((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0) {
        return { status: 'active', ddayText: diffDays === 0 ? '오늘 마감' : `D-${diffDays}`, isPurge: false };
      } else {
        const expiredDays = Math.abs(diffDays);
        return { status: 'expired', ddayText: `${expiredDays}일 전 만료`, isPurge: expiredDays > 90 };
      }
    }

    function purgeOldCoupons(list) {
      list.forEach(item => { if (item.coupons) item.coupons = item.coupons.filter(c => !evaluateCoupon(c.expireDate).isPurge); });

    function renderGames() {
      const grid = document.getElementById('gameGridContainer');
      if (!grid) return;
      let filtered = games.filter(g => {
        if (activePlatform !== 'all' && !g.platforms.includes(activePlatform) && !g.platforms.includes('cross')) return false;

        if (searchQuery && !g.title.toLowerCase().includes(searchQuery)) return false;
        return true;
      });
      document.getElementById('gameTotalCount').innerText = `${filtered.length}개`;
      grid.innerHTML = filtered.map(game => {
        const activeCount = (game.coupons || []).filter(c => evaluateCoupon(c.expireDate).status === 'active').length;

          <div onclick="openGameDetail('${game.id}')" class="group cursor-pointer rounded-2xl bg-slate-900/80 hover:bg-slate-850 border border-slate-800 hover:border-purple-500/50 p-3.5 transition flex flex-col justify-between">

          </div>
        `;
      }).join('');

    function openGameDetail(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game) return;
      document.getElementById('modalGameIcon').innerText = game.icon || '🎮';
      document.getElementById('modalGameTitle').innerText = game.title;
      document.getElementById('modalGamePublisher').innerText = game.publisher;
      const container = document.getElementById('modalCouponListContainer');
      const coupons = game.coupons || [];
      container.innerHTML = coupons.length === 0 ? `<div class="text-center py-6 text-slate-500">등록된 쿠폰이 없습니다.</div>` : coupons.map(c => `

        </div>
      `).join('');
      document.getElementById('couponDetailModal').classList.remove('hidden');
    }
    function closeDetailModal() { document.getElementById('couponDetailModal').classList.add('hidden'); }
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copyToast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 1500);
      });
    }

    function handleLogoSecretClick() {
