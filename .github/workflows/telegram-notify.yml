# 새 쿠폰 텔레그램 알림
# 쿠폰 루틴이 새 코드를 올리면(push) 바로 알리고, 밤에 올라온 코드는 아침 8시 5분(한국 시간)에 모아서 알린다.
# 필요한 설정 (저장소 Settings > Secrets and variables > Actions):
#   Secrets   → TELEGRAM_BOT_TOKEN : BotFather 가 준 봇 토큰
#   Variables → TELEGRAM_CHAT_ID   : 채널 주소 (예: @ecm_coupon)
name: 새 쿠폰 텔레그램 알림

on:
  push:
    branches: [main]
    paths:
      - data/coupon-seen.json
      - index.html
  schedule:
    - cron: '5 23 * * *'   # 매일 08:05 KST
  workflow_dispatch:
    inputs:
      test:
        description: "연결 확인용 테스트 메시지만 보내기"
        type: boolean
        default: false

concurrency:
  group: telegram-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 새 쿠폰 알림 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test && '1' || '0' }}
        run: node scripts/notify-telegram.js
      - name: 보낸 기록 저장
        run: |
          if [ -n "$(git status --porcelain data/telegram-sent.json)" ]; then
            git config user.name "ecm-telegram-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/telegram-sent.json
            git commit -m "텔레그램 알림 기록 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
