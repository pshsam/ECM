<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ECM 병아리 마스코트">
  <!-- ECM 마스코트: 그물망 덮인 철모를 쓰고 날개를 앞으로 모은 병아리. 철모 정면에 ECM.
       운영자 스케치(2026-09-23)를 바탕으로 그렸다. 직접 그린 그림이라 저작권은 ECM 것. -->
  <defs>
    <clipPath id="dome"><path d="M46 78 C46 22, 154 22, 154 78 Z"/></clipPath>
  </defs>
  <!-- 발 -->
  <g stroke="#C8783C" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M86 180 v10 M86 190 l-11 7 M86 190 v9 M86 190 l11 7"/>
    <path d="M114 180 v10 M114 190 l-11 7 M114 190 v9 M114 190 l11 7"/>
  </g>
  <!-- 몸통 -->
  <ellipse cx="100" cy="142" rx="50" ry="42" fill="#FFE14D"/>
  <!-- 배 -->
  <ellipse cx="100" cy="158" rx="24" ry="16" fill="#FFF3B0"/>
  <!-- 앞으로 모은 날개 -->
  <ellipse cx="78" cy="150" rx="13" ry="23" fill="#F7C600" transform="rotate(40 78 150)"/>
  <ellipse cx="122" cy="150" rx="13" ry="23" fill="#F7C600" transform="rotate(-40 122 150)"/>
  <!-- 머리 -->
  <circle cx="100" cy="92" r="40" fill="#FFE14D"/>
  <!-- 눈 (점처럼 작게) -->
  <circle cx="86" cy="99" r="3.6" fill="#1A1600"/>
  <circle cx="114" cy="99" r="3.6" fill="#1A1600"/>
  <!-- 부리 -->
  <path d="M93 106 h14 l-7 11 z" fill="#F28C00"/>
  <!-- 입 -->
  <path d="M94 123 Q100 127 106 123" stroke="#C87A5A" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 철모: 뒤쪽 테 -->
  <ellipse cx="100" cy="78" rx="60" ry="11" fill="#5E7A38"/>
  <!-- 철모: 돔 -->
  <path d="M46 78 C46 22, 154 22, 154 78 Z" fill="#86A85A"/>
  <!-- 그물망 -->
  <g clip-path="url(#dome)" stroke="#6B4B2A" stroke-width="1.8" opacity=".7" fill="none">
    <path d="M30 22 L88 80 M44 22 L102 80 M58 22 L116 80 M72 22 L130 80 M86 22 L144 80 M100 22 L158 80 M114 22 L172 80"/>
    <path d="M86 22 L28 80 M100 22 L42 80 M114 22 L56 80 M128 22 L70 80 M142 22 L84 80 M156 22 L98 80 M170 22 L112 80"/>
  </g>
  <!-- 철모: 앞쪽 테 -->
  <path d="M40 78 A60 11 0 0 0 160 78 Z" fill="#5E7A38"/>
  <path d="M42 77 A58 9 0 0 1 158 77" stroke="#9DBD70" stroke-width="2" fill="none" opacity=".8"/>
  <!-- 계급장 자리: ECM 패치 -->
  <rect x="81" y="52" width="38" height="15" rx="3" fill="#F3ECD2" stroke="#3F4A1E" stroke-width="1.5"/>
  <text x="100" y="64" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#3F4A1E" letter-spacing="1">ECM</text>
</svg>
