<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ECM 병아리 마스코트">
  <!-- ECM 마스코트: 군모를 쓴 병아리. 계급장 자리에 ECM. 직접 그린 그림이라 저작권은 ECM 것. -->
  <!-- 발 -->
  <g stroke="#F28C00" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M84 176 v14 M84 190 l-9 6 M84 190 l9 6"/>
    <path d="M116 176 v14 M116 190 l-9 6 M116 190 l9 6"/>
  </g>
  <!-- 몸통 -->
  <ellipse cx="100" cy="128" rx="60" ry="54" fill="#FFE14D"/>
  <!-- 날개 -->
  <ellipse cx="46" cy="128" rx="13" ry="24" fill="#F7C600" transform="rotate(-18 46 128)"/>
  <ellipse cx="154" cy="128" rx="13" ry="24" fill="#F7C600" transform="rotate(18 154 128)"/>
  <!-- 배 -->
  <ellipse cx="100" cy="142" rx="34" ry="28" fill="#FFF3B0"/>
  <!-- 머리 -->
  <circle cx="100" cy="84" r="50" fill="#FFE14D"/>
  <!-- 볼 -->
  <circle cx="70" cy="97" r="7" fill="#FFB0A0" opacity=".75"/>
  <circle cx="130" cy="97" r="7" fill="#FFB0A0" opacity=".75"/>
  <!-- 눈 -->
  <circle cx="83" cy="84" r="5.5" fill="#1A1600"/>
  <circle cx="117" cy="84" r="5.5" fill="#1A1600"/>
  <circle cx="85" cy="82" r="1.8" fill="#fff"/>
  <circle cx="119" cy="82" r="1.8" fill="#fff"/>
  <!-- 부리 -->
  <path d="M91 94 h18 l-9 11 z" fill="#FF9F1C"/>
  <path d="M91 94 h18 l-9 4 z" fill="#F28C00"/>
  <!-- 군모 (패트롤 캡) -->
  <path d="M56 62 C56 34, 144 34, 144 62 L144 68 L56 68 Z" fill="#6B7A3A"/>
  <path d="M60 46 C72 36, 128 36, 140 46 L140 50 C126 42, 74 42, 60 50 Z" fill="#7B8B46"/>
  <rect x="54" y="60" width="92" height="12" rx="3" fill="#55632C"/>
  <!-- 챙 -->
  <path d="M60 70 C78 82, 122 82, 140 70 C126 76, 74 76, 60 70 Z" fill="#3F4A1E"/>
  <!-- 계급장 자리: ECM 패치 -->
  <rect x="80" y="44" width="40" height="16" rx="3" fill="#F3ECD2" stroke="#3F4A1E" stroke-width="1.5"/>
  <text x="100" y="56.5" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="11.5" fill="#3F4A1E" letter-spacing="1">ECM</text>
</svg>
